<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flow Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FAF6F8;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-solid: #FFFFFF;
      --text-main: #2D1B22;
      --text-muted: #9E828C;
      --accent-pink: #FF6B8B;
      --accent-soft: #FFF0F3;
      --border-color: rgba(255, 228, 233, 0.7);

      --flow-light: #FFC2D1;
      --flow-medium: #FF4D6D;
      --flow-heavy: #A4133C;

      --radius-lg: 24px;
      --radius-md: 16px;
      --shadow-sm: 0 4px 20px rgba(255, 107, 139, 0.06);
      --shadow-md: 0 12px 32px rgba(230, 57, 70, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding-bottom: 110px; min-height: 100vh; }

    header {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-weight: 800;
      font-size: 1.25rem;
      background: linear-gradient(135deg, #FF4D6D 0%, #C9184A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-banner {
      background: var(--card-solid);
      margin: 16px 20px 0 20px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-mode {
      background: var(--accent-soft);
      border: none;
      color: var(--accent-pink);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-mode.active {
      background: var(--accent-pink);
      color: white;
    }

    .container { max-width: 440px; margin: 0 auto; padding: 16px 20px; }

    .summary-card {
      background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F7 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
    }

    .summary-title { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .summary-val { font-size: 1.25rem; font-weight: 800; color: var(--text-main); margin-top: 4px; }

    .calendar-container {
      background: var(--card-solid);
      border-radius: var(--radius-lg);
      padding: 20px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .nav-btn {
      background: var(--bg);
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
    }

    .month-title { font-weight: 800; font-size: 1.1rem; color: var(--text-main); }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 12px;
      column-gap: 6px;
      justify-items: center;
    }

    .day-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      position: relative;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .day-item.empty { cursor: default; }

    .day-item.flow-1 { background-color: var(--flow-light); color: #5C001E; font-weight: 800; }
    .day-item.flow-2 { background-color: var(--flow-medium); color: white; font-weight: 800; }
    .day-item.flow-3 { background-color: var(--flow-heavy); color: white; font-weight: 800; }

    .day-item.today:not(.flow-1):not(.flow-2):not(.flow-3) {
      background: var(--accent-soft);
      color: var(--accent-pink);
      font-weight: 800;
    }

    .day-item.selected {
      outline: 2px solid var(--accent-pink);
      outline-offset: 3px;
    }

    .action-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 40px);
      max-width: 400px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-md);
      border-radius: 30px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      z-index: 90;
    }

    .action-btns { display: flex; gap: 8px; width: 100%; }

    .btn-action {
      flex: 1;
      padding: 12px 8px;
      border-radius: 22px;
      border: none;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-action.quick-add { background: var(--accent-soft); color: var(--accent-pink); }
    .btn-action.edit { background: var(--accent-pink); color: white; }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(45, 27, 34, 0.3);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-solid);
      width: 100%;
      max-width: 440px;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 28px 24px 32px 24px;
    }

    .flow-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 20px 0;
    }

    .flow-option {
      padding: 16px 8px;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--border-color);
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .flow-option.selected {
      border-color: var(--accent-pink);
      background: var(--accent-soft);
      color: var(--accent-pink);
    }

    .btn-clear {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-save {
      width: 100%;
      background: linear-gradient(135deg, #FF6B8B 0%, #FF4D6D 100%);
      color: white;
      border: none;
      padding: 16px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }

    .btn-edit-direct {
      width: 100%;
      background: var(--accent-soft);
      color: var(--accent-pink);
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      margin-top: 16px;
    }

    .detail-val {
      font-weight: 800;
      font-size: 1.15rem;
      color: var(--text-main);
      background: var(--bg);
      padding: 16px;
      border-radius: var(--radius-md);
      text-align: center;
      margin-top: 14px;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌸 Flow Tracker</div>
  </header>

  <div class="user-banner">
    <div>Track Period Days</div>
    <button class="btn-mode" id="bulkToggleBtn" onclick="toggleBulkMode()">Select Multiple</button>
  </div>

  <div class="container">
    <div class="summary-card">
      <div>
        <div class="summary-title">Last Period Start</div>
        <div class="summary-val" id="lastStart">--</div>
      </div>
      <div style="text-align: right;">
        <div class="summary-title">Cycle Length</div>
        <div class="summary-val" id="cycleDays">--</div>
      </div>
    </div>

    <div class="calendar-container">
      <div class="calendar-header">
        <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
        <div class="month-title" id="monthTitle">--</div>
        <button class="nav-btn" onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekdays">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <div class="action-btns">
      <button class="btn-action quick-add" onclick="quickMarkPeriod()">🌸 Mark Period (<span id="selectedCount">0</span>)</button>
      <button class="btn-action edit" onclick="openBatchEditModal()">✎ Intensity & Details</button>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <h3 style="font-size: 1.15rem; font-weight: 800;" id="detailTitle">Date Details</h3>
      <div class="detail-val" id="detailFlowVal">--</div>
      <button class="btn-edit-direct" onclick="editSingleDate()">✎ Edit Flow Intensity</button>
    </div>
  </div>

  <div class="modal" id="entryModal">
    <div class="modal-content">
      <h3 style="font-size: 1.15rem; font-weight: 800;" id="modalTitle">Set Flow Intensity</h3>
      
      <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); margin-top: 16px;">FLOW INTENSITY</div>
      <div class="flow-picker">
        <button class="flow-option" id="flow1" onclick="selectFlow(1)">
          <span>🩸</span> Light
        </button>
        <button class="flow-option" id="flow2" onclick="selectFlow(2)">
          <span>🩸🩸</span> Medium
        </button>
        <button class="flow-option" id="flow3" onclick="selectFlow(3)">
          <span>🩸🩸🩸</span> Heavy
        </button>
      </div>

      <button class="btn-clear" onclick="selectFlow('')">Clear Entry</button>
      <button class="btn-save" id="saveBtn" onclick="saveEntry()">Save</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfaVGQG1qIMyICb9lYNJLCM7W7DziH0wjfBnZ43m3ZHWuYogXivR8vCs3iX0kB0y7G-Q/exec";

    let monthOffset = 0;
    let dbData = {};
    let selectedDates = new Set();
    let isBulkMode = false;
    let activeSingleDate = null;
    let selectedFlow = 1;

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();

    renderCalendar();
    fetchData();

    async function fetchData() {
      const cached = localStorage.getItem('period_db_data');
      if (cached) {
        try {
          dbData = JSON.parse(cached);
          renderCalendar();
          updateSummary();
        } catch (e) {}
      }

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const freshData = await response.json();
        if (freshData && typeof freshData === 'object') {
          dbData = { ...dbData, ...freshData };
          localStorage.setItem('period_db_data', JSON.stringify(dbData));
          renderCalendar();
          updateSummary();
        }
      } catch (e) {
        console.error("Fetch error:", e);
      }
    }

    function toggleBulkMode() {
      isBulkMode = !isBulkMode;
      selectedDates.clear();
      updateActionBar();
      
      const btn = document.getElementById('bulkToggleBtn');
      btn.classList.toggle('active', isBulkMode);
      btn.innerText = isBulkMode ? 'Done Selecting' : 'Select Multiple';
      document.getElementById('actionBar').style.display = isBulkMode ? 'flex' : 'none';
      
      renderCalendar();
    }

    function handleDateClick(dateStr) {
      if (isBulkMode) {
        if (selectedDates.has(dateStr)) {
          selectedDates.delete(dateStr);
        } else {
          selectedDates.add(dateStr);
        }
        updateActionBar();
        renderCalendar();
      } else {
        openDayDetail(dateStr);
      }
    }

    function openDayDetail(dateStr) {
      activeSingleDate = dateStr;
      const dayData = dbData[dateStr] || {};
      const flow = dayData.flow;

      let flowText = "No Period Recorded";
      if (flow == 1) flowText = "🩸 Light Flow";
      else if (flow == 2) flowText = "🩸🩸 Medium Flow";
      else if (flow == 3) flowText = "🩸🩸🩸 Heavy Flow";

      document.getElementById('detailTitle').innerText = dateStr;
      document.getElementById('detailFlowVal').innerText = flowText;
      document.getElementById('detailModal').classList.add('open');
    }

    function editSingleDate() {
      closeDetailModal();
      selectedDates.clear();
      selectedDates.add(activeSingleDate);
      openBatchEditModal();
    }

    function openBatchEditModal() {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }

      if (selectedDates.size === 1) {
        const dateStr = Array.from(selectedDates)[0];
        const dayData = dbData[dateStr] || {};
        selectedFlow = dayData.flow || 1;
      } else {
        selectedFlow = 1;
      }

      updateFlowUI();
      document.getElementById('modalTitle').innerText = `Edit ${selectedDates.size} Selected Day(s)`;
      document.getElementById('entryModal').classList.add('open');
    }

    function selectFlow(level) {
      selectedFlow = level;
      updateFlowUI();
    }

    function updateFlowUI() {
      [1, 2, 3].forEach(i => {
        const btn = document.getElementById(`flow${i}`);
        if (btn) btn.classList.toggle('selected', selectedFlow == i);
      });
    }

    function updateActionBar() {
      document.getElementById('selectedCount').innerText = selectedDates.size;
    }

    async function quickMarkPeriod() {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }
      selectedFlow = 1;
      await saveEntry();
    }

    async function saveEntry() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const datesArray = Array.from(selectedDates);

      datesArray.forEach(dateStr => {
        if (!dbData[dateStr]) dbData[dateStr] = {};
        dbData[dateStr].flow = selectedFlow;
      });

      localStorage.setItem('period_db_data', JSON.stringify(dbData));
      renderCalendar();
      updateSummary();

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            dates: datesArray,
            flow: selectedFlow
          })
        });
        
        setTimeout(fetchData, 1500);
      } catch (err) {
        console.error("Save error:", err);
      }

      saveBtn.innerText = "Save";
      saveBtn.disabled = false;
      
      selectedDates.clear();
      updateActionBar();
      closeModal();
    }

    function changeMonth(delta) {
      monthOffset += delta;
      selectedDates.clear();
      updateActionBar();
      renderCalendar();
    }

    function closeModal() {
      document.getElementById('entryModal').classList.remove('open');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    function updateSummary() {
      const sortedDates = Object.keys(dbData)
        .filter(d => dbData[d].flow !== "" && dbData[d].flow !== undefined && dbData[d].flow !== null)
        .sort();

      if (sortedDates.length === 0) {
        document.getElementById('lastStart').innerText = '--';
        document.getElementById('cycleDays').innerText = '--';
        return;
      }

      let startDates = [];
      sortedDates.forEach((dateStr, idx) => {
        if (idx === 0) {
          startDates.push(dateStr);
        } else {
          const prev = new Date(sortedDates[idx - 1]);
          const curr = new Date(dateStr);
          const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
          if (diffDays > 4) startDates.push(dateStr);
        }
      });

      const lastStart = startDates[startDates.length - 1];
      document.getElementById('lastStart').innerText = lastStart || '--';

      if (startDates.length >= 2) {
        const prevStart = new Date(startDates[startDates.length - 2]);
        const latestStart = new Date(lastStart);
        const cycleDays = Math.round((latestStart - prevStart) / (1000 * 60 * 60 * 24));
        document.getElementById('cycleDays').innerText = `${cycleDays} days`;
      } else {
        document.getElementById('cycleDays').innerText = '--';
      }
    }

    function renderCalendar() {
      const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      document.getElementById('monthTitle').innerText = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="day-item empty"></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = dbData[dateStr] || {};
        const flow = dayData.flow;
        const isToday = dateStr === todayStr;
        const isSelected = selectedDates.has(dateStr);

        let flowClass = '';
        if (flow == 1) flowClass = 'flow-1';
        else if (flow == 2) flowClass = 'flow-2';
        else if (flow == 3) flowClass = 'flow-3';

        grid.innerHTML += `
          <div class="day-item ${flowClass} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="handleDateClick('${dateStr}')">
            ${day}
          </div>
        `;
      }
    }

    document.getElementById('entryModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('entryModal')) closeModal();
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) closeDetailModal();
    });
  </script>
</body>
</html>
