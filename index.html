<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flow Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #FFF5F7;
      --card-bg: #FFFFFF;
      --text: #4A1525;
      --text-muted: #A36B7B;
      --primary: #E11D48;
      --primary-light: #FFE4E6;
      
      /* Flow Intensity Colors */
      --flow-light: #FFB3C1;
      --flow-medium: #E63946;
      --flow-heavy: #9B001C;

      --border: #FCE7F3;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 95px; }

    header {
      background: var(--card-bg);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand { font-weight: 800; font-size: 1.15rem; color: var(--primary); display: flex; align-items: center; gap: 6px; }

    .user-banner {
      background: #FFE4E6;
      border-bottom: 1px solid #FECDD3;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #9F1239;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-mode {
      background: white;
      border: 1px solid #FECDD3;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-mode.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .container { max-width: 480px; margin: 0 auto; padding: 14px; }

    .summary-card {
      background: linear-gradient(135deg, #FFF0F3 0%, #FFE4E6 100%);
      border: 1px solid #FECDD3;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .summary-title { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .summary-val { font-size: 1.1rem; font-weight: 800; color: var(--primary); margin-top: 2px; }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      background: var(--card-bg);
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .nav-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
    }

    .month-title { font-weight: 800; font-size: 1rem; color: var(--text); }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.7rem;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* Gridless Calendar Layout */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      row-gap: 12px;
      column-gap: 4px;
      justify-items: center;
    }

    .day-item {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text);
      cursor: pointer;
      position: relative;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .day-item.empty { cursor: default; }

    /* Circle styled dates */
    .day-item.flow-1 {
      background-color: var(--flow-light);
      color: #701A2A;
      box-shadow: 0 2px 6px rgba(255, 179, 193, 0.5);
    }

    .day-item.flow-2 {
      background-color: var(--flow-medium);
      color: white;
      box-shadow: 0 2px 6px rgba(230, 57, 70, 0.4);
    }

    .day-item.flow-3 {
      background-color: var(--flow-heavy);
      color: white;
      box-shadow: 0 2px 6px rgba(155, 0, 28, 0.5);
    }

    .day-item.today:not(.flow-1):not(.flow-2):not(.flow-3) {
      border: 2px solid var(--primary);
      color: var(--primary);
    }

    .day-item.selected {
      outline: 3px solid var(--primary);
      outline-offset: 2px;
    }

    .action-bar {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      box-shadow: 0 10px 25px rgba(225,29,72,0.15);
      border-radius: 18px;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      z-index: 90;
    }

    .action-btns {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
    }

    .btn-action.quick-add { background: var(--primary-light); color: var(--primary); border-color: #FECDD3; }
    .btn-action.edit { background: var(--primary); color: white; border-color: var(--primary); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(74, 21, 37, 0.4);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal.open { display: flex; }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
    }

    .flow-picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 16px 0;
    }

    .flow-option {
      padding: 12px 6px;
      border-radius: 14px;
      border: 2px solid var(--border);
      background: var(--bg);
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .flow-option.selected {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .btn-clear {
      width: 100%;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      margin-bottom: 12px;
    }

    .btn-save {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.25);
    }

    .btn-edit-direct {
      width: 100%;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #FECDD3;
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 14px;
    }

    .detail-val {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
      background: var(--bg);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      margin-top: 10px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">🌸 Flow Tracker</div>
  </header>

  <div class="user-banner">
    <div>Track Period Days</div>
    <button class="btn-mode" id="bulkToggleBtn" onclick="toggleBulkMode()">Select Multiple</button>
  </div>

  <div class="container">
    <div class="summary-card">
      <div>
        <div class="summary-title">Last Period Start</div>
        <div class="summary-val" id="lastStart">--</div>
      </div>
      <div style="text-align: right;">
        <div class="summary-title">Cycle Length</div>
        <div class="summary-val" id="cycleDays">--</div>
      </div>
    </div>

    <div class="calendar-header">
      <button class="nav-btn" onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="monthTitle">--</div>
      <button class="nav-btn" onclick="changeMonth(1)">›</button>
    </div>

    <div class="weekdays">
      <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <div class="action-bar" id="actionBar" style="display: none;">
    <div class="action-btns">
      <button class="btn-action quick-add" onclick="quickMarkPeriod()">🌸 Mark Period (<span id="selectedCount">0</span>)</button>
      <button class="btn-action edit" onclick="openBatchEditModal()">✎ Intensity & Details</button>
    </div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="detailTitle">Date Details</h3>
      <div class="detail-val" id="detailFlowVal">--</div>
      <button class="btn-edit-direct" onclick="editSingleDate()">✎ Edit Flow Intensity</button>
    </div>
  </div>

  <div class="modal" id="entryModal">
    <div class="modal-content">
      <h3 style="font-size: 1.1rem; font-weight: 800;" id="modalTitle">Set Flow Intensity</h3>
      
      <div style="font-size: 0.78rem; font-weight: 700; color: var(--text-muted); margin-top: 14px;">FLOW INTENSITY:</div>
      <div class="flow-picker">
        <button class="flow-option" id="flow1" onclick="selectFlow(1)">
          <span>🩸</span> Light
        </button>
        <button class="flow-option" id="flow2" onclick="selectFlow(2)">
          <span>🩸🩸</span> Medium
        </button>
        <button class="flow-option" id="flow3" onclick="selectFlow(3)">
          <span>🩸🩸🩸</span> Heavy
        </button>
      </div>

      <button class="btn-clear" onclick="selectFlow('')">Clear Entry</button>
      <button class="btn-save" id="saveBtn" onclick="saveEntry()">Save</button>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyrunrjowC0Lbjsqlo7G2X8qGSBDpW0qqGVsLgHuziAIPlCK9syOSRPBU9txjLeEKCQdg/exec";

    let monthOffset = 0;
    let dbData = {};
    let selectedDates = new Set();
    let isBulkMode = false;
    let activeSingleDate = null;
    let selectedFlow = 1;

    const now = new Date();
    let currentYear = now.getFullYear();
    let currentMonth = now.getMonth();

    renderCalendar();
    fetchData();

    async function fetchData() {
      const cached = localStorage.getItem('period_db_data');
      if (cached) {
        try {
          dbData = JSON.parse(cached);
          renderCalendar();
          updateSummary();
        } catch (e) {}
      }

      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        const freshData = await response.json();
        if (freshData && typeof freshData === 'object') {
          dbData = freshData;
          localStorage.setItem('period_db_data', JSON.stringify(dbData));
          renderCalendar();
          updateSummary();
        }
      } catch (e) {
        console.error("Fetch error:", e);
      }
    }

    function toggleBulkMode() {
      isBulkMode = !isBulkMode;
      selectedDates.clear();
      updateActionBar();
      
      const btn = document.getElementById('bulkToggleBtn');
      btn.classList.toggle('active', isBulkMode);
      btn.innerText = isBulkMode ? 'Done Selecting' : 'Select Multiple';
      document.getElementById('actionBar').style.display = isBulkMode ? 'flex' : 'none';
      
      renderCalendar();
    }

    function handleDateClick(dateStr) {
      if (isBulkMode) {
        if (selectedDates.has(dateStr)) {
          selectedDates.delete(dateStr);
        } else {
          selectedDates.add(dateStr);
        }
        updateActionBar();
        renderCalendar();
      } else {
        openDayDetail(dateStr);
      }
    }

    function openDayDetail(dateStr) {
      activeSingleDate = dateStr;
      const dayData = dbData[dateStr] || {};
      const flow = dayData.flow;

      let flowText = "No Period Recorded";
      if (flow == 1) flowText = "🩸 Light Flow";
      else if (flow == 2) flowText = "🩸🩸 Medium Flow";
      else if (flow == 3) flowText = "🩸🩸🩸 Heavy Flow";

      document.getElementById('detailTitle').innerText = dateStr;
      document.getElementById('detailFlowVal').innerText = flowText;
      document.getElementById('detailModal').classList.add('open');
    }

    function editSingleDate() {
      closeDetailModal();
      selectedDates.clear();
      selectedDates.add(activeSingleDate);
      openBatchEditModal();
    }

    function openBatchEditModal() {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }

      if (selectedDates.size === 1) {
        const dateStr = Array.from(selectedDates)[0];
        const dayData = dbData[dateStr] || {};
        selectedFlow = dayData.flow || 1;
      } else {
        selectedFlow = 1;
      }

      updateFlowUI();
      document.getElementById('modalTitle').innerText = `Edit ${selectedDates.size} Selected Day(s)`;
      document.getElementById('entryModal').classList.add('open');
    }

    function selectFlow(level) {
      selectedFlow = level;
      updateFlowUI();
    }

    function updateFlowUI() {
      [1, 2, 3].forEach(i => {
        document.getElementById(`flow${i}`).classList.toggle('selected', selectedFlow == i);
      });
    }

    function updateActionBar() {
      document.getElementById('selectedCount').innerText = selectedDates.size;
    }

    async function quickMarkPeriod() {
      if (selectedDates.size === 0) {
        alert("Please select one or more days first!");
        return;
      }
      selectedFlow = 1;
      await saveEntry();
    }

    async function saveEntry() {
      const saveBtn = document.getElementById('saveBtn');
      saveBtn.innerText = "Saving...";
      saveBtn.disabled = true;

      const datesArray = Array.from(selectedDates);

      datesArray.forEach(dateStr => {
        if (!dbData[dateStr]) dbData[dateStr] = {};
        dbData[dateStr].flow = selectedFlow;
      });

      localStorage.setItem('period_db_data', JSON.stringify(dbData));
      renderCalendar();
      updateSummary();

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            dates: datesArray,
            flow: selectedFlow
          })
        });
        setTimeout(fetchData, 1200);
      } catch (err) {
        console.error("Save error:", err);
      }

      saveBtn.innerText = "Save";
      saveBtn.disabled = false;
      
      selectedDates.clear();
      updateActionBar();
      closeModal();
    }

    function changeMonth(delta) {
      monthOffset += delta;
      selectedDates.clear();
      updateActionBar();
      renderCalendar();
    }

    function closeModal() {
      document.getElementById('entryModal').classList.remove('open');
    }

    function closeDetailModal() {
      document.getElementById('detailModal').classList.remove('open');
    }

    function updateSummary() {
      const sortedDates = Object.keys(dbData)
        .filter(d => dbData[d].flow !== "" && dbData[d].flow !== undefined && dbData[d].flow !== null)
        .sort();

      if (sortedDates.length === 0) {
        document.getElementById('lastStart').innerText = '--';
        document.getElementById('cycleDays').innerText = '--';
        return;
      }

      let startDates = [];
      sortedDates.forEach((dateStr, idx) => {
        if (idx === 0) {
          startDates.push(dateStr);
        } else {
          const prev = new Date(sortedDates[idx - 1]);
          const curr = new Date(dateStr);
          const diffDays = (curr - prev) / (1000 * 60 * 60 * 24);
          if (diffDays > 4) startDates.push(dateStr);
        }
      });

      const lastStart = startDates[startDates.length - 1];
      document.getElementById('lastStart').innerText = lastStart || '--';

      if (startDates.length >= 2) {
        const prevStart = new Date(startDates[startDates.length - 2]);
        const latestStart = new Date(lastStart);
        const cycleDays = Math.round((latestStart - prevStart) / (1000 * 60 * 60 * 24));
        document.getElementById('cycleDays').innerText = `${cycleDays} days`;
      } else {
        document.getElementById('cycleDays').innerText = '--';
      }
    }

    function renderCalendar() {
      const targetDate = new Date(currentYear, currentMonth + monthOffset, 1);
      const year = targetDate.getFullYear();
      const month = targetDate.getMonth();

      document.getElementById('monthTitle').innerText = targetDate.toLocaleString('default', { month: 'long', year: 'numeric' });

      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      for (let i = 0; i < firstDayIndex; i++) {
        grid.innerHTML += `<div class="day-item empty"></div>`;
      }

      const todayStr = new Date().toISOString().split('T')[0];

      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = dbData[dateStr] || {};
        const flow = dayData.flow;
        const isToday = dateStr === todayStr;
        const isSelected = selectedDates.has(dateStr);

        let flowClass = '';
        if (flow == 1) flowClass = 'flow-1';
        else if (flow == 2) flowClass = 'flow-2';
        else if (flow == 3) flowClass = 'flow-3';

        grid.innerHTML += `
          <div class="day-item ${flowClass} ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''}" onclick="handleDateClick('${dateStr}')">
            ${day}
          </div>
        `;
      }
    }

    document.getElementById('entryModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('entryModal')) closeModal();
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) closeDetailModal();
    });
  </script>
</body>
</html>
